name: Build Bakir Khata Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release with downloadable APK"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag (used only when Publish a GitHub Release is enabled, e.g. v1.0.0)"
        required: false
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi

          # Ensure SDK root and target subdirectories are writable by current user (avoid touching huge NDK/system-images)
          MY_UID="$(id -u)"
          MY_GID="$(id -g)"
          ensure_writable() {
            local target="$1"
            if [ ! -e "$target" ]; then
              mkdir -p "$target" 2>/dev/null || {
                sudo -n true 2>/dev/null && sudo -n mkdir -p "$target" && sudo -n chown -R "${MY_UID}:${MY_GID}" "$target"
              }
            elif [ ! -w "$target" ] || [ "$(stat -c '%u' "$target" 2>/dev/null || echo 0)" != "$MY_UID" ]; then
              if [ -w "$target" ] && [ "$target" = "$SDK_ROOT" ]; then
                return 0
              fi
              sudo -n true 2>/dev/null && sudo -n chown -R "${MY_UID}:${MY_GID}" "$target"
            fi
          }

          if [ ! -w "$SDK_ROOT" ]; then
            if sudo -n true 2>/dev/null; then
              sudo -n chown "${MY_UID}:${MY_GID}" "$SDK_ROOT" || {
                SDK_ROOT="$HOME/android-sdk"
                mkdir -p "$SDK_ROOT"
              }
            else
              SDK_ROOT="$HOME/android-sdk"
              mkdir -p "$SDK_ROOT"
            fi
          fi

          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "Installing Android command-line tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-extract
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            chmod +x "$SDKMANAGER"
          fi

          for sub in licenses platforms build-tools platform-tools .temp; do
            ensure_writable "$SDK_ROOT/$sub" || true
          done
          if [ ! -w "$SDK_ROOT/licenses" ]; then
            echo "SDK licenses directory is not writable; using $HOME/android-sdk"
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-extract
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$SDKMANAGER"
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

          SDK_LIST="$("$SDKMANAGER" --sdk_root="$SDK_ROOT" --list)"
          if grep -qE '(^|[[:space:]])platforms;android-36\.1([[:space:]]|$)' <<< "$SDK_LIST"; then
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36.1"
          fi

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit & Robolectric tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK for download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BakirKhata-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BakirKhata-debug-apk
          path: dist/BakirKhata-debug.apk
          retention-days: 30

      - name: Check optional release signing secrets
        id: release_secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > my-upload-key.jks
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed Release APK & AAB (if secrets configured)
        if: steps.release_secrets.outputs.enabled == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk dist/BakirKhata-release.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/BakirKhata-release.aab

      - name: Upload Release APK & AAB artifacts
        if: steps.release_secrets.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BakirKhata-release-outputs
          path: |
            dist/BakirKhata-release.apk
            dist/BakirKhata-release.aab
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.release_tag }}"
          fi

          FILES=("dist/BakirKhata-debug.apk")
          if [ -f "dist/BakirKhata-release.apk" ]; then
            FILES+=("dist/BakirKhata-release.apk")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "বাকির খাতা ($TAG)" \
              --notes "বাকির খাতা (Bakir Khata) Android APK build from GitHub Actions."
          fi
